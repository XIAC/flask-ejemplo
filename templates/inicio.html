<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Aplicación Flask</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            text-align: center;
            padding: 50px 20px;
        }

        h1 {
            color: #2456a6;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        .contenedor {
            background: white;
            padding: 35px;
            border-radius: 12px;
            max-width: 650px;
            margin: 40px auto;
            box-shadow: 0 3px 12px #ddd;
        }

        .boton {
            display: inline-block;
            background-color: #2456a6;
            color: white;
            padding: 12px 22px;
            margin: 10px;
            border-radius: 6px;
            text-decoration: none;
        }

        .boton:hover {
            background-color: #173e7a;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>Bienvenidos a nuestra aplicación Flask</h1>

        <p>
            Proyecto desarrollado para la asignatura
            Taller de Aplicaciones en Internet.
        </p>

        <p>
            Ejemplo de navegación entre páginas HTML
            utilizando Python y Flask.
        </p>

        <a class="boton" href="/estudiantes">
            Ver estudiantes
        </a>

        <a class="boton" href="/contacto">
            Contacto
        </a>
    </div>
</body>
</html>
