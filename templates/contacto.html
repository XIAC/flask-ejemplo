<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Aplicación Flask</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            text-align: center;
            padding: 50px 20px;
        }
        .contenedor {
            background: white;
            max-width: 600px;
            margin: 30px auto;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #ddd;
        }
        h1 { color: #2456a6; }
        p { color: #555; }
        input, textarea {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: Arial, sans-serif;
        }
        button {
            background: #2456a6;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
        }
        a {
            display: block;
            margin-top: 25px;
            color: #2456a6;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>Contáctanos</h1>
        <p>Formulario de contacto.</p>

        <form>
            <input type="text" placeholder="Tu nombre" required>
            <input type="email" placeholder="Tu correo electrónico" required>
            <textarea rows="5" placeholder="Escribe tu mensaje" required></textarea>
            <button type="button">Enviar mensaje</button>
        </form>

        <p>Envia tu mensaje UAB.</p>
        <a href="/">Volver al inicio</a>
    </div>
</body>
</html>
